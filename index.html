<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <!-- Racha actual -->
    <section class="seccion-racha">
      <p class="racha-titulo">Racha actual</p>
      <div class="sello">
        <span class="sello-numero" id="racha-dias">0</span>
        <span class="sello-texto" id="racha-texto">días seguidos</span>
      </div>
      <div class="racha-datos">
        <p class="dato-fila">
          <span class="dato-etiqueta">Esta semana</span>
          <span class="dato-puntos" aria-hidden="true"></span>
          <span class="dato-valor" id="semana-minutos">0 min</span>
        </p>
        <p class="dato-fila">
          <span class="dato-etiqueta">Este mes</span>
          <span class="dato-puntos" aria-hidden="true"></span>
          <span class="dato-valor" id="mes-dias">0 días</span>
        </p>
      </div>
    </section>

    <hr class="divisor">

    <!-- Formulario para registrar una sesión -->
    <section>
      <h2>Registrar sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="¿Qué has estudiado?" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" step="1" placeholder="Ej: 30" required>

        <p class="error" id="error"></p>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <hr class="divisor">

    <!-- Lista de sesiones -->
    <section>
      <h2>Sesiones</h2>
      <p class="vacio" id="vacio">Todavía no hay sesiones registradas.</p>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
